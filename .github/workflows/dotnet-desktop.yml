name: Build and Release PFN

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like v1.0.0
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Version tag for manual runs (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0-manual'

permissions:
  contents: write # Grants the token permission to create releases and upload assets

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine Version Number
      id: version
      run: |
        if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $VER = '${{ github.event.inputs.manual_version }}'
        } else {
            $VER = '${{ github.ref_name }}'
        }
        echo "VERSION=$VER" >> $env:GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish application
      # Directly targets the project file and enables normal verbosity for clear error output
      run: dotnet publish PfnUseDump.csproj -c Release -r win-x64 --self-contained false -o .\output -v n

    - name: Create versioned ZIP archive
      run: |
        $ZipFileName = "Pfn-${env:VERSION}-win-x64.zip"
        Compress-Archive -Path .\output\* -DestinationPath $ZipFileName
        echo "ZIP_FILE=$ZipFileName" >> $env:GITHUB_ENV

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_FILE }}
        tag_name: ${{ env.VERSION }}
        generate_release_notes: true
