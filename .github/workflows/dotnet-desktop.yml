name: Build and Release PFN

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a tag like v1.0.0
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Version tag for manual runs (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0-manual'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine Version Numbers
      id: version
      run: |
        if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $TAG = '${{ github.event.inputs.manual_version }}'
        } else {
            $TAG = '${{ github.ref_name }}'
        }
        
        # Strip the 'v' prefix so NuGet doesn't crash (e.g., v1.0.0 -> 1.0.0)
        $CLEAN_VER = $TAG.TrimStart('v')
        
        # Save to safe variable names that won't hijack internal MSBuild properties
        echo "RELEASE_TAG=$TAG" >> $env:GITHUB_ENV
        echo "DOTNET_VERSION=$CLEAN_VER" >> $env:GITHUB_ENV

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish application
      # Uses the clean version number to successfully restore packages and stamp the .exe
      run: dotnet publish PfnUseDump.csproj -c Release -r win-x64 --self-contained false -o .\output -p:Version=${env:DOTNET_VERSION}

    - name: Create versioned ZIP archive
      run: |
        $ZipFileName = "Pfn-${env:RELEASE_TAG}-win-x64.zip"
        Compress-Archive -Path .\output\* -DestinationPath $ZipFileName
        echo "ZIP_FILE=$ZipFileName" >> $env:GITHUB_ENV

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_FILE }}
        tag_name: ${{ env.RELEASE_TAG }}
        generate_release_notes: true
